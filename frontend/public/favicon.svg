<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .ring-bg { fill: #2E8B8B; }
      .ring-outer { stroke: #F5F5DC; stroke-width: 6; fill: none; }
      .ring-inner { stroke: #228B22; stroke-width: 3; fill: none; }
      .diamond { fill: #F5F5DC; }
      .text { font-size: 14px; fill: #F5F5DC; font-weight: bold; font-family: 'Playfair Display', serif; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" class="ring-bg"/>
  
  <!-- Ring Outer Circle -->
  <circle cx="50" cy="50" r="30" class="ring-outer"/>
  
  <!-- Ring Inner Circle -->
  <circle cx="50" cy="50" r="20" class="ring-inner"/>
  
  <!-- Diamond/Gem -->
  <polygon points="50,12 58,28 50,38 42,28" class="diamond"/>
  
  <!-- Initials OC -->
  <text x="50" y="74" text-anchor="middle" class="text">OC</text>
</svg>
